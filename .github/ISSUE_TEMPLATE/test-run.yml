name: Test Run
description: A single test run against a Test Case. File this as a sub-issue of the Test Case being run (use the Test Case's "Create sub-issue" button).
title: "Run "
labels: ["test-run"]
body:
  - type: markdown
    attributes:
      value: |
        File this as a **sub-issue** of the Test Case it belongs to - the "Sync QA result" workflow only picks it up if it has a parent issue.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Pass with comments
        - Fail
        - Blocked
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - iPad
    validations:
      required: true
  - type: dropdown
    id: input-method
    attributes:
      label: Input Method
      options:
        - N/A
        - Touch
        - Pencil
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local build
        - Live site
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What you observed, especially for Fail/Blocked/Pass with comments.
    validations:
      required: false
