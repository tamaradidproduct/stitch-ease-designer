name: Deploy to production (needs approval)

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deploy is gated on the suite: this is what the group uses, and a
      # broken build reaching them is worse than a late one.
      - run: npm run typecheck
      - run: npm test

      # These are meant to be public - they ship in the built bundle regardless,
      # and row-level security is the real protection, not secrecy of this key -
      # so repo variables rather than secrets.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: release_approval
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # This environment is the release gate. Keep the Pages-specific environment
  # on the actual deploy job so the deploy-pages action continues to publish to
  # the production GitHub Pages site.
  release_approval:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment approved"
