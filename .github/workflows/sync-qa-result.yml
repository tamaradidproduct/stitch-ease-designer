name: Sync QA result from Test Run sub-issue

# A retest is a Test Run sub-issue (Test Run issue template) filed under a
# Test Case issue. This reads its form fields and writes them onto the
# *parent* Test Case's project fields and qa-flagged label, then closes the
# Test Run - it's a completed report, not an open task. Replaces both
# Airtable's rollup/sync-status automation and the older comment-parsing
# version of this workflow.
on:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  OWNER: tamaradidproduct
  PROJECT_NUMBER: 2

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'test-run')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve parent Test Case
        id: parent
        run: |
          result=$(gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on Issue { parent { number url id } }
              }
            }' -f id="${{ github.event.issue.node_id }}")
          number=$(echo "$result" | jq -r '.data.node.parent.number // empty')
          url=$(echo "$result" | jq -r '.data.node.parent.url // empty')
          if [ -z "$number" ]; then
            echo "::warning::Test Run issue #${{ github.event.issue.number }} has no parent Test Case - skipping (retesting requires filing this as a sub-issue)"
            echo "has_parent=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_parent=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse the Test Run's form fields
        id: parse
        if: steps.parent.outputs.has_parent == 'true'
        env:
          # Passed as an env var, not interpolated into the script text below -
          # the issue body is attacker-controlled on a public repo, and
          # splicing it directly into a `run:` block via ${{ }} is a real
          # script-injection vector (it becomes part of the shell source,
          # not a value). Reading it from $ISSUE_BODY keeps it as data.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          body="$ISSUE_BODY"
          field() {
            echo "$body" | sed -n "/^### $1\$/,/^### /p" | sed '1d;$d' | sed '/^_No response_$/d' | sed '/^[[:space:]]*$/d' | head -1
          }
          echo "result=$(field 'Result')" >> "$GITHUB_OUTPUT"
          echo "device=$(field 'Device')" >> "$GITHUB_OUTPUT"
          echo "input=$(field 'Input Method')" >> "$GITHUB_OUTPUT"
          echo "environment=$(field 'Environment')" >> "$GITHUB_OUTPUT"

      - name: Resolve project + field metadata
        id: meta
        if: steps.parent.outputs.has_parent == 'true'
        run: |
          fields=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          project_id=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq '.id')
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "$fields" > /tmp/fields.json

      - name: Add parent Test Case to project (idempotent) and get item id
        id: item
        if: steps.parent.outputs.has_parent == 'true'
        run: |
          item_id=$(gh project item-add "$PROJECT_NUMBER" --owner "$OWNER" \
            --url "${{ steps.parent.outputs.url }}" --format json --jq '.id')
          echo "item_id=$item_id" >> "$GITHUB_OUTPUT"

      - name: Set a single-select field on the parent, by name
        if: steps.parent.outputs.has_parent == 'true'
        env:
          # Env vars, not ${{ }} splices - these values came from parsing the
          # (attacker-controlled, public-repo) issue body, so they must flow
          # through as data, never be spliced into the script source.
          ITEM_ID: ${{ steps.item.outputs.item_id }}
          PROJECT_ID: ${{ steps.meta.outputs.project_id }}
          RESULT_VALUE: ${{ steps.parse.outputs.result }}
          DEVICE_VALUE: ${{ steps.parse.outputs.device }}
          INPUT_VALUE: ${{ steps.parse.outputs.input }}
          ENVIRONMENT_VALUE: ${{ steps.parse.outputs.environment }}
        run: |
          set_field() {
            local field_name="$1" value="$2"
            [ -z "$value" ] && return 0
            local field_id option_id
            field_id=$(jq -r --arg n "$field_name" '.fields[] | select(.name==$n) | .id' /tmp/fields.json)
            option_id=$(jq -r --arg n "$field_name" --arg v "$value" \
              '.fields[] | select(.name==$n) | .options[] | select(.name|ascii_downcase==($v|ascii_downcase)) | .id' /tmp/fields.json)
            if [ -z "$option_id" ]; then
              echo "::warning::Unrecognized $field_name value '$value' - skipping"
            else
              gh project item-edit --id "$ITEM_ID" \
                --project-id "$PROJECT_ID" \
                --field-id "$field_id" --single-select-option-id "$option_id"
            fi
          }
          set_field "Result" "$RESULT_VALUE"
          set_field "Device" "$DEVICE_VALUE"
          set_field "Input Method" "$INPUT_VALUE"
          set_field "Environment" "$ENVIRONMENT_VALUE"

      - name: Auto-label qa-flagged on the parent for Fail/Blocked/Pass with comments
        if: steps.parent.outputs.has_parent == 'true' && contains(fromJSON('["Fail", "Blocked", "Pass with comments"]'), steps.parse.outputs.result)
        run: gh issue edit "${{ steps.parent.outputs.number }}" --repo "${{ github.repository }}" --add-label qa-flagged

      - name: Remove qa-flagged from the parent when a run passes clean
        if: steps.parent.outputs.has_parent == 'true' && steps.parse.outputs.result == 'Pass'
        run: gh issue edit "${{ steps.parent.outputs.number }}" --repo "${{ github.repository }}" --remove-label qa-flagged

      - name: Close the Test Run - it's a completed report, not an open task
        if: steps.parent.outputs.has_parent == 'true'
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
