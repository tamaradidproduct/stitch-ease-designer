name: Open staging promotion pull request

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or find the staging promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head staging \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "$existing_url" ]]; then
            echo "A staging promotion pull request is already open: $existing_url"
            echo "## Staging promotion" >> "$GITHUB_STEP_SUMMARY"
            echo "An existing pull request is ready for review: $existing_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ahead_by="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/main...staging" \
            --jq '.ahead_by')"

          if [[ "$ahead_by" -eq 0 ]]; then
            echo "::error::The staging branch has no commits to promote to main."
            exit 1
          fi

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head staging \
            --title "Promote staging to production" \
            --body $'Promotes the version currently deployed to staging into production.\n\nStaging: https://staging.designer.stitch-ease.com\n\n- [ ] QA is complete\n- [ ] The staging build is approved for production')"

          echo "Created staging promotion pull request: $pr_url"
          echo "## Staging promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "Created a pull request for review: $pr_url" >> "$GITHUB_STEP_SUMMARY"
