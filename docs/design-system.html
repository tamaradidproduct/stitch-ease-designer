html,
body,
#root {
  /* dvh tracks the browser's actual visible viewport, shrinking and growing
     with a mobile browser's address bar - plain % here inherits from the
     layout viewport instead, which can stay taller than what's genuinely
     on screen. With body's overflow hidden below, anything that overflowed
     the real screen this way wasn't just clipped, it was unreachable -
     nothing to scroll to reach it. Kept as a fallback for browsers that
     don't know dvh; unsupported values are ignored, not applied as 0. */
  height: 100%;
  height: 100dvh;
  margin: 0;
}

body {
  overflow: hidden;
  background: var(--bg);
  /* The canvas handles its own gestures; page-level bounce fights panning. */
  overscroll-behavior: none;
}

/* Flex rather than fixed grid rows: banners appear and disappear above the
   stage, and a fixed row count would put the canvas in the wrong row. */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.app > *:not(.stage) {
  flex: none;
}

.app--message {
  align-items: center;
  justify-content: center;
  gap: var(--space-6);
}

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  padding-right: var(--panel-width);
}

.canvas {
  display: block;
  width: 100%;
  height: 100%;
  /* Suppress native pan/zoom so the wheel and pointer handlers own the gesture. */
  touch-action: none;
}

/* Honour the OS "reduce motion" setting: keep state changes, drop the
   movement. 0.01ms rather than 0 so transitionend/animationend still fire. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
`,"../styles/buttons.css":`/* ---- buttons -----------------------------------------------------------
   Rendered by <Button> / <IconButton> (ui/Button.tsx). Without a size
   modifier a button sizes to its padding; --sm/--md/--lg pin it to a
   control height. */

.btn {
  display: inline-flex;
  align-items: center;
  padding: var(--space-3) var(--space-6);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font: inherit;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-solid);
}

.btn--primary:hover:not(:disabled) {
  filter: brightness(1.08);
  color: var(--on-solid);
}

.btn--quiet {
  border-color: transparent;
  background: none;
  color: var(--text-muted);
}

.btn--danger:hover:not(:disabled) {
  border-color: var(--danger);
  color: var(--danger);
}

.btn[data-on="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-solid);
}

.btn--sm,
.btn--md,
.btn--lg {
  justify-content: center;
  padding-block: 0;
}

.btn--sm {
  min-height: var(--control-sm);
  padding-inline: var(--space-4);
  font-size: var(--font-size-sm);
}

.btn--md {
  min-height: var(--control-md);
}

.btn--lg {
  min-height: var(--control-lg);
  padding-inline: var(--space-6);
}
`,"../styles/chartList.css":`/* ---- chart list -------------------------------------------------------- */

.charts {
  max-width: var(--page-max-width);
  margin: 0 auto;
  padding: var(--space-10) var(--space-8) var(--space-11);
}

.charts__head {
  display: flex;
  align-items: center;
  gap: var(--space-6);
}

.charts__title {
  flex: 1;
  margin: 0;
  font-size: var(--font-size-xl);
  letter-spacing: -0.02em;
}

.charts__actions {
  display: flex;
  gap: var(--space-4);
}

.charts__note {
  margin: var(--space-3) 0 var(--space-8);
  color: var(--text-muted);
  font-size: var(--font-size-sm);
}

.charts__error {
  margin: 0 0 var(--space-7);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-sm);
  background: var(--danger-soft-bg);
  color: var(--danger-ink);
}

.charts__empty {
  padding: var(--space-10) 0;
  color: var(--text-muted);
}

.charts__list {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: var(--border-width) solid var(--border);
}

.chartrow {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  border-bottom: var(--border-width) solid var(--border);
}

.chartrow__open {
  display: flex;
  align-items: baseline;
  gap: var(--space-6);
  flex: 1;
  min-width: 0;
  padding: var(--space-6) var(--space-2);
  border: none;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.chartrow__open:hover .chartrow__name {
  color: var(--accent);
}

.chartrow__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: var(--font-weight-medium);
}

.chartrow__when {
  flex: none;
  color: var(--text-muted);
  font-size: var(--font-size-sm);
}

.chartrow__rename {
  flex: 1;
  padding: var(--space-3) 0;
}

.chartrow__input {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  border: var(--border-width) solid var(--accent);
  border-radius: var(--radius-sm);
  font: inherit;
  color: var(--text);
  outline: none;
}

.chartrow__tools {
  display: flex;
  gap: var(--space-1);
  flex: none;
}
`,"../styles/color.css":`/*
 * Shared color-chip affordance (FR-25/26/34): one chip, one rule
 * (\`applyChipColor\`) wherever it appears - picker tiles, drawer rows, and
 * glossary rows.
 */
.colorChip {
  position: absolute;
  right: calc(var(--space-2) * -1);
  bottom: calc(var(--space-2) * -1);
  z-index: 2;
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  /* #265: a border/fill that both matched --bg was invisible against a
     pale, uncolored tile. A solid --border ring plus a soft drop shadow
     reads as a control regardless of the tile's own color. */
  border: var(--border-width-thick) solid var(--border);
  border-radius: var(--radius-circle);
  padding: 0;
  background: var(--bg);
  color: var(--text-muted);
  cursor: pointer;
  box-shadow: var(--shadow-1);
}

.colorChip:hover,
.colorChip:focus-visible,
.colorChip[aria-expanded="true"] {
  color: var(--accent);
  outline: none;
}

.colorPopover {
  z-index: var(--z-popover);
}

.colorPopover__swatch {
  border: var(--border-width) solid var(--hairline-ink);
  border-radius: var(--radius-sm);
  cursor: pointer;
  padding: 0;
}

.colorPopover__swatch:hover,
.colorPopover__swatch:focus-visible {
  outline: var(--border-width-focus) solid var(--accent);
  outline-offset: 1px;
}
`,"../styles/confirmDialog.css":`/* ---- confirm dialog ------------------------------------------------ */

.confirmDialog__overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--scrim);
  z-index: var(--z-modal);
}

.confirmDialog {
  width: min(320px, calc(100vw - 32px));
  padding: var(--space-8);
  border-radius: var(--radius-lg);
  background: var(--bg);
  box-shadow: var(--shadow-4);
}

.confirmDialog__message {
  margin: 0 0 var(--space-7);
  color: var(--text);
}

`,"../styles/referenceDock.css":`.referenceDockPositioner {
  position: absolute;
  z-index: var(--z-dock);
  bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  /* The right panel reserves 304px of the stage, and .referenceImageQuickDock
     floats another ~230px past that (see its own right: 328px). Reserving
     both here, not just the panel, keeps this dock centered in space that's
     actually empty instead of drifting under the quick dock on a narrow
     (e.g. iPad-portrait) viewport, where there isn't 560px+ of slack to
     absorb the overlap unnoticed. */
  right: 560px;
  left: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.referenceDock {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  /* Bounded by the positioner's own (already-reserved) width, not the full
     viewport - vw here would let this reach past the space actually left
     for it and under the right panel. */
  max-width: calc(100% - 32px);
  padding: var(--space-4);
  overflow-x: auto;
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  box-shadow: var(--shadow-3);
  backdrop-filter: var(--blur-glass);
  pointer-events: auto;
}

.referenceDock .toolDock__button:disabled {
  opacity: 0.42;
  cursor: default;
}

/* Save changes is its own pill, unbundled from the scale-setup tools, and
   pinned to the right edge of the same lane those tools are centered in -
   a separate, always-in-the-same-place action rather than one more button
   in a group of tools whose count/width changes as calibration proceeds. */
.referenceDock--save {
  position: absolute;
  right: 0;
  bottom: 0;
}

.referenceImageQuickDockGroup {
  position: absolute;
  z-index: var(--z-dock);
  bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-4);
}

/* Without this, the icon-only dock would stretch to match the wider Save
   changes pill below it (align-items: stretch above) instead of staying a
   compact column of its own - flex-end keeps both flush on their shared
   right edge as the default, with the icon dock itself re-centered under
   the (usually wider) Save button below. */
.referenceImageQuickDockGroup--stacked {
  align-items: flex-end;
}

.referenceImageQuickDock {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  box-shadow: var(--shadow-3);
  backdrop-filter: var(--blur-glass);
}

/* Narrower canvases: the secondary actions (Hide / Bring to front)
   collapse to icons that expand while the dock is hovered or focused, then,
   when very narrow, stack in a column - with Save changes moved out into
   its own full-width pill underneath (see .referenceDock--save-stacked).
   Touch screens have no hover, so the icons keep their titles/aria-labels
   there. */
.referenceImageQuickDock--icons .toolDock__button,
.referenceImageQuickDock--stacked .toolDock__button {
  min-width: 38px;
  overflow: hidden;
  transition:
    width 150ms ease,
    padding 150ms ease,
    gap 150ms ease;
}

.referenceImageQuickDock--icons .toolDock__button span,
.referenceImageQuickDock--stacked .toolDock__button span {
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  white-space: nowrap;
  transition:
    max-width 150ms ease,
    opacity 100ms ease;
}

.referenceImageQuickDock--icons .toolDock__button,
.referenceImageQuickDock--stacked .toolDock__button {
  padding: 0 var(--space-5);
  gap: 0;
