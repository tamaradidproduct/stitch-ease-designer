import { buttonClassName, type ButtonStyleProps } from "./buttonClassName";

export type ButtonProps = ButtonStyleProps &
  Omit<ButtonHTMLAttributes<HTMLButtonElement>, "className" | "type"> & {
    /** Toggle state, shown as the solid accent fill (\`[data-on]\`). */
    on?: boolean | undefined;
    /** Defaults to "button" - a bare <button> inside a form would submit it. */
    type?: "button" | "submit" | "reset";
  };

/** The app's standard text button. */
export const Button = forwardRef<HTMLButtonElement, ButtonProps>(({ variant, danger, size, className, on, type = "button", ...rest }, ref) => {
  return (
    <button
      ref={ref}
      type={type}
      className={buttonClassName({ variant, danger, size, className }) || undefined}
      data-on={on === undefined ? undefined : on}
      {...rest}
    />
  );
});

Button.displayName = "Button";

export type IconButtonProps = Omit<ButtonProps, "aria-label" | "title"> & {
  /** Accessible name - required, since the visible content is only an icon. */
  label: string;
  /** Hover tooltip; defaults to no tooltip rather than repeating \`label\`. */
  tooltip?: string | undefined;
};

/** A button whose only visible content is an icon, so it must carry a label. */
export const IconButton = forwardRef<HTMLButtonElement, IconButtonProps>(({ label, tooltip, ...rest }, ref) => {
  return <Button ref={ref} aria-label={label} title={tooltip} {...rest} />;
});

IconButton.displayName = "IconButton";

const formatWhen = (iso: string) => {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const days = Math.floor((Date.now() - date.getTime()) / 86_400_000);
  if (days === 0) return \`today, \${date.toLocaleTimeString([], { timeStyle: "short" })}\`;
  if (days === 1) return "yesterday";
  if (days < 7) return \`\${days} days ago\`;
  return date.toLocaleDateString([], { dateStyle: "medium" });
};

export function ChartList() {
  const navigate = useNavigate();
  const [charts, setCharts] = useState<DocMeta[] | null>(null);
  const [error, setError] = useState<string | null>(null);
  const [renaming, setRenaming] = useState<string | null>(null);
  const [deleting, setDeleting] = useState<DocMeta | null>(null);
  const fileInput = useRef<HTMLInputElement | null>(null);

  const refresh = useCallback(async () => {
    try {
      setCharts(await chartStore.list());
    } catch (e) {
      setError(e instanceof Error ? e.message : "Could not read your charts");
    }
  }, []);

  useEffect(() => {
    void refresh();
  }, [refresh]);

  // \`refreshAfter: false\` for actions that navigate away from this list -
  // it's about to unmount, so re-fetching and setting state on the way out
  // is wasted work.
  const run = async (action: () => Promise<void>, { refreshAfter = true } = {}) => {
    try {
      setError(null);
      await action();
      if (refreshAfter) await refresh();
    } catch (e) {
      setError(e instanceof Error ? e.message : "Something went wrong");
    }
  };

  const onNew = () =>
    run(
      async () => {
        const meta = await chartStore.create();
        navigate(\`/c/\${meta.id}\`);
      },
      { refreshAfter: false },
    );

  const onImport = (file: File) =>
    run(
      async () => {
        const meta = await importChartIntoStore(chartStore, file);
        navigate(\`/c/\${meta.id}\`);
      },
      { refreshAfter: false },
    );

  return (
    <div className="charts">
      <header className="charts__head">
        <h1 className="charts__title">My charts</h1>
        <div className="charts__actions">
          <Button onClick={() => fileInput.current?.click()}>
            Import
          </Button>
          <Button variant="primary" onClick={onNew}>
            New chart
          </Button>
          {/* No real session to sign out of in dev-bypass mode - the button
              would be a visible no-op, so it's not shown at all rather than
              shown disabled or explained. */}
          {!DEV_SKIP_AUTH && (
            <Button variant="quiet" onClick={() => void signOut()}>
              Sign out
            </Button>
          )}
        </div>
      </header>

      <input
        ref={fileInput}
        type="file"
        accept=".json,application/json"
        hidden
        onChange={(e) => {
          const file = e.target.files?.[0];
          // Reset first, so picking the same file twice in a row still fires.
          e.target.value = "";
          if (file) void onImport(file);
        }}
      />

      <p className="charts__note">
        {DEV_SKIP_AUTH
          ? "Dev mode — sign-in bypassed, charts saved in this browser only."
          : "Saved to your account — signed-in on another device shows the same charts. " +
            "Export is still there if you want a local copy."}
      </p>

      {error && <p className="charts__error">{error}</p>}

      {charts === null && <p className="charts__empty">Loading…</p>}

      {charts?.length === 0 && (
        <p className="charts__empty">No charts yet. Make one and start drawing.</p>
      )}

      <ul className="charts__list">
        {charts?.map((chart) => (
          <li key={chart.id} className="chartrow">
            {renaming === chart.id ? (
              <form
                className="chartrow__rename"
                onSubmit={(e) => {
                  e.preventDefault();
                  const name = new FormData(e.currentTarget).get("name");
                  setRenaming(null);
                  if (typeof name === "string" && name.trim() && name.trim() !== chart.name) {
                    void run(() => chartStore.rename(chart.id, name.trim()).then(() => {}));
                  }
                }}
              >
                <TextField
                  variant="rename"
                  name="name"
                  className="chartrow__input"
                  aria-label="Chart name"
                  defaultValue={chart.name}
                  autoFocus
                  onBlur={() => setRenaming(null)}
                  onKeyDown={(e) => {
                    if (e.key === "Escape") setRenaming(null);
                  }}
                />
              </form>
            ) : (
              <Button variant="unstyled"
                className="chartrow__open"
                onClick={() => navigate(\`/c/\${chart.id}\`)}
              >
                <span className="chartrow__name">{chart.name}</span>
                <span className="chartrow__when">{formatWhen(chart.updatedAt)}</span>
              </Button>
            )}

            <div className="chartrow__tools">
              <Button
                variant="quiet"
                onClick={() => setRenaming(chart.id)}
              >
                Rename
              </Button>
              <Button
                variant="quiet"
                danger
                onClick={() => setDeleting(chart)}
              >
                Delete
              </Button>
            </div>
          </li>
        ))}
      </ul>

      {deleting && (
        <ConfirmDialog
          message={\`Delete "\${deleting.name}"? This can't be undone.\`}
          onCancel={() => setDeleting(null)}
          onConfirm={() => {
            const chart = deleting;
            setDeleting(null);
            void run(async () => {
              const loaded = await chartStore.load(chart.id);
              await Promise.all(
                (loaded.referenceImages ?? []).map((image) => removeReferenceImageFile(image.ref)),
              );
              await chartStore.remove(chart.id);
            });
          }}
        />
      )}
    </div>
  );
}

import { COLOR_GRID } from "../model/colorPalette";
import { handleColorSwatchClick, resolveColorPopoverPosition } from "./colorSwatchPopoverPosition";
import { useDismissOnOutsideOrEscape } from "./useDismissOnOutsideOrEscape";
import { Popover } from "./Popover";
import { Button } from "./Button";

export type ColorSwatchPopoverProps = {
  /** The chip's own rect, measured live rather than relying on CSS containing-block luck (see the file's own doc comment). */
  anchorRect: DOMRect;
  /** Optional panel rect this popover should clear (used by floating picker chips). */
  boundaryRect?: DOMRect | null;
  placement?: "below-first" | "above-first";
  onSelect: (colorId: string) => void;
  onClose: () => void;
};

const SWATCH = 22;
const GAP = 3;
const PAD = 8;
const COLUMNS = 8;
const ROWS = 4;
const OFFSET = 6;

/**
 * The color grid popover shared by every "open a color menu" affordance
 * (the color chip on the picker's quick tile, its drawer rows, and the
 * glossary rows). Always anchors via a measured \`getBoundingClientRect\`
 * rather than plain CSS \`position: absolute\`, which is what let one earlier
 * copy of this popover render invisibly inside a clipping, scrolling
 * ancestor (\`overflow: hidden\` on a drawer, \`overflow-y: auto\` on the list
 * inside it) - \`position: fixed\` escapes that ancestor chain entirely, so
 * the next place this chip gets added can't silently reproduce that bug.
 *
 * Fixed grid of 32 preset swatches only - no native \`<input type="color">\`,
 * no "more colors" escape hatch, no "no color" cell. One click is always
 * exactly one apply.
 */
export function ColorSwatchPopover({
  anchorRect,
  boundaryRect,
  placement = "below-first",
  onSelect,
  onClose,
}: ColorSwatchPopoverProps) {
  const rootRef = useRef<HTMLDivElement | null>(null);
  const width = COLUMNS * SWATCH + (COLUMNS - 1) * GAP + PAD * 2;
  const height = ROWS * SWATCH + (ROWS - 1) * GAP + PAD * 2;
  const [pos, setPos] = useState({ left: anchorRect.left, top: anchorRect.bottom + OFFSET });

  useLayoutEffect(() => {
    setPos(resolveColorPopoverPosition({
      anchorRect,
      boundaryRect: boundaryRect ?? null,
      placement,
      width,
      height,
      viewportWidth: window.innerWidth,
      viewportHeight: window.innerHeight,
    }));
  }, [anchorRect, boundaryRect, placement, width, height]);

  useDismissOnOutsideOrEscape({
    onDismiss: onClose,
    containerRef: rootRef,
    captureOutsidePointerdown: true,
    captureEscape: true,
    closeOnScroll: true,
  });

  return (
    <Popover
      ref={rootRef}
      className="colorPopover"
      role="dialog"
      aria-label="Choose a color"
      style={{
        position: "fixed",
        left: pos.left,
        top: pos.top,
        width,
        display: "grid",
        gridTemplateColumns: \`repeat(\${COLUMNS}, \${SWATCH}px)\`,
        gap: GAP,
        padding: PAD,
      }}
    >
      {COLOR_GRID.map((swatch) => (
        <Button variant="unstyled"
          key={swatch.id}
          className="colorPopover__swatch"
          style={{ width: SWATCH, height: SWATCH, background: swatch.hex }}
          aria-label={\`\${swatch.hue} \${swatch.step + 1}\`}
          title={swatch.hex}
          onClick={(event) => handleColorSwatchClick(event, onSelect, swatch.id)}
        />
      ))}
    </Popover>
  );
}

import { useDismissOnOutsideOrEscape } from "./useDismissOnOutsideOrEscape";
import { Button } from "./Button";

export type ConfirmDialogProps = {
  message: string;
  confirmLabel?: string;
  cancelLabel?: string;
  danger?: boolean;
  /** Further choices shown between Cancel and the confirm button (e.g. "Detach copies"). */
  extraActions?: { label: string; onClick: () => void }[];
  onConfirm: () => void;
  onCancel: () => void;
};

/**
 * Stand-in for \`window.confirm()\`, which some environments this app runs in
 * (e.g. an iPad home-screen/PWA shortcut, an embedded webview) suppress
 * silently - the confirming click then does nothing, with no dialog and no
 * error. Rendering our own means the confirmation always shows up.
 */
export function ConfirmDialog({
  message,
  confirmLabel = "Delete",
  cancelLabel = "Cancel",
  danger = true,
  extraActions = [],
  onConfirm,
  onCancel,
}: ConfirmDialogProps) {
  const confirmRef = useRef<HTMLButtonElement | null>(null);
  const dialogRef = useRef<HTMLDivElement | null>(null);

  useEffect(() => {
    confirmRef.current?.focus();
  }, []);

  useDismissOnOutsideOrEscape({
    onDismiss: onCancel,
    // No document-level outside-pointerdown handling here - the overlay's
    // own onPointerDown below already closes the dialog on a backdrop click
    // (and, being a full-viewport backdrop, is never missed by a click that
    // isn't also on the dialog itself).
    dismissOnOutsidePointerdown: false,
  });

  useEffect(() => {
    const onKeyDown = (e: KeyboardEvent) => {
      if (e.key === "Tab") {
        const dialog = dialogRef.current;
        const focusable = dialog?.querySelectorAll("button");
        if (!dialog || !focusable || focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (!first || !last) return;
        // Focus can land outside the dialog (e.g. a click on the
        // non-focusable message text, or the overlay); redirect it back in
        // rather than letting Tab escape to the page behind the dialog.
        if (!dialog.contains(document.activeElement)) {
          e.preventDefault();
          (e.shiftKey ? last : first).focus();
          return;
        }
        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
    };
    document.addEventListener("keydown", onKeyDown);
    return () => document.removeEventListener("keydown", onKeyDown);
  }, []);

  return (
    <div className="confirmDialog__overlay" onPointerDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div ref={dialogRef} className="confirmDialog" role="alertdialog" aria-modal="true" aria-label={message}>
        <p className="confirmDialog__message">{message}</p>
        <div className="confirmDialog__actions">
          <Button variant="quiet" onClick={onCancel}>
            {cancelLabel}
          </Button>
          {extraActions.map((action) => (
            <Button key={action.label} onClick={action.onClick}>
              {action.label}
            </Button>
          ))}
          <Button
            ref={confirmRef}
            variant={danger ? "default" : "primary"}
            className={danger ? "confirmDialog__confirm" : undefined}
            onClick={onConfirm}
          >
            {confirmLabel}
          </Button>
        </div>
      </div>
    </div>
  );
}

import { localChartStore } from "../storage/store";
import { Button } from "./Button";

type Phase =
  | { step: "checking" }
  | { step: "none" }
  | { step: "offer"; charts: DocMeta[] }
  | { step: "working" }
  | { step: "done"; result: MigrationResult }
  | { step: "error"; message: string };

/**
 * Shown once per sign-in, before the chart list, if this browser has charts
 * saved from before accounts existed.
 *
 * Skipping is safe either way: declining leaves the charts in browser storage
 * untouched, so nothing is lost, and this screen offers again next sign-in
 * rather than trying to remember a permanent dismissal — for an invite-only
 * handful of testers, re-asking is a smaller risk than silently orphaning
 * charts because a "don't ask again" flag then hid a real backlog.
 */
export function MigrateLocalCharts({
  targetStore,
  onDone,
}: {
  targetStore: ChartStore;
  onDone: () => void;
}) {
  const [phase, setPhase] = useState<Phase>({ step: "checking" });

  useEffect(() => {
    let cancelled = false;
    void localChartStore
      .list()
      .then((charts) => {
        if (cancelled) return;
        setPhase(charts.length > 0 ? { step: "offer", charts } : { step: "none" });
      })
      .catch((error: unknown) => {
        if (cancelled) return;
        setPhase({
          step: "error",
          message: error instanceof Error ? error.message : "Could not check browser storage",
        });
      });
    return () => {
      cancelled = true;
    };
  }, []);

  useEffect(() => {
    if (phase.step === "none") onDone();
  }, [phase.step, onDone]);

  if (phase.step === "checking" || phase.step === "none") return null;

  if (phase.step === "offer") {
    const { charts } = phase;
    return (
      <div className="signIn">
        <div className="signIn__card">
          <h1 className="signIn__title">Bring your charts along?</h1>
          <p className="signIn__sent">
            This browser has {charts.length} chart{charts.length === 1 ? "" : "s"} saved from
            before you signed in:
          </p>
          <ul className="charts__list">
            {charts.map((c) => (
              <li key={c.id} className="chartrow">
                <span className="chartrow__name">{c.name}</span>
              </li>
            ))}
          </ul>
          <div className="signIn__form signIn__form--actions">
            <Button variant="unstyled"
              onClick={() => {
                setPhase({ step: "working" });
                void migrateLocalCharts(localChartStore, targetStore)
                  .then((result) => setPhase({ step: "done", result }))
                  .catch((error: unknown) =>
                    setPhase({
                      step: "error",
                      message: error instanceof Error ? error.message : "Could not copy charts",
                    }),
                  );
              }}
            >
              Add to my account
            </Button>
            <Button variant="quiet" onClick={onDone}>
              Not now
            </Button>
          </div>
        </div>
      </div>
    );
  }

  if (phase.step === "working") {
    return (
      <div className="signIn">
        <div className="signIn__card">
          <p className="signIn__sent">Copying your charts…</p>
        </div>
      </div>
    );
  }

  if (phase.step === "error") {
    return (
      <div className="signIn">
        <div className="signIn__card">
          <h1 className="signIn__title">Couldn't check your local charts</h1>
          <p className="signIn__error">{phase.message}</p>
          <p className="signIn__sent">Your browser charts have not been changed.</p>
          <div className="signIn__form signIn__form--actions">
            <Button variant="unstyled" onClick={onDone}>
              Continue
            </Button>
          </div>
        </div>
      </div>
    );
  }

  const { result } = phase;
  return (
    <div className="signIn">
      <div className="signIn__card">
        <h1 className="signIn__title">Done</h1>
        {result.migrated.length > 0 && (
          <p className="signIn__sent">Added: {result.migrated.join(", ")}.</p>
        )}
        {result.failed.length > 0 && (
          <p className="signIn__error">

            browser, try again later.
          </p>
        )}
        <div className="signIn__form signIn__form--actions">
          <Button variant="unstyled" onClick={onDone}>
            Continue
          </Button>
        </div>
      </div>
    </div>
  );
}

/** The right panel's zoom controls and "Center chart at 100%". */
export function NavigatorSection() {
  const index = useDocStore((state) => state.index);
  const zoom = useUiStore((state) => state.camera.zoom);
  const viewport = useUiStore((state) => state.viewport);
  const zoomAt = useUiStore((state) => state.zoomAt);
  const centerViewAt100 = useUiStore((state) => state.centerViewAt100);

  const zoomFromCenter = (factor: number) => {
    zoomAt(factor, viewport.width / 2, viewport.height / 2);
  };

  const centerChart = () => {
    const placements = index.toArray();
    if (!placements.length) {
      centerViewAt100(0, 0);
      return;
    }
    let minCol = Infinity;
    let maxCol = -Infinity;
    let minRow = Infinity;
    let maxRow = -Infinity;
    for (const placement of placements) {
      minCol = Math.min(minCol, placement.col);
      maxCol = Math.max(maxCol, placement.col + index.spanOf(placement));
      minRow = Math.min(minRow, placement.row);
      maxRow = Math.max(maxRow, placement.row + 1);
    }
    centerViewAt100(((minCol + maxCol) / 2) * CELL, ((minRow + maxRow) / 2) * CELL);
  };

  return (
    <SideModule title="Navigator" subtitle="Move around the canvas" bodyClassName="navigator">
      <div className="navigator__zoom" aria-label="Canvas zoom">

 * Touch/Pencil equivalent of holding Space - a tap-toggled modifier, not a

 * Erase stay exactly as they were and resume the instant Pan turns back
 * off. This is deliberate - Space has always worked underneath whatever
 * tool is active, and Pan is that same modifier for a device with no key to
 * hold, not a fifth entry in the tool switcher. Kept in its own corner
 * rather than folded into the main toolDock so it stays reachable one-
 * handed regardless of where that dock ends up on screen. Shown on every
 * platform (see the comment on .panDock in styles/toolbar.css for why it's not
 * hidden on desktop).
 */
export function PanButton() {
  const panEnabled = useUiStore((s) => s.panEnabled);
  const setPanEnabled = useUiStore((s) => s.setPanEnabled);
  const referenceImagePanelOpen = useUiStore((s) => s.referenceImagePanelOpen);
  const rightPanelWidth = useUiStore((s) => s.rightPanelWidth);
  const dockRef = useRef<HTMLDivElement>(null);

  const toggle = () => setPanEnabled(!panEnabled);

  useLayoutEffect(() => {
    if (typeof document === "undefined") return;
    const stage = document.querySelector<HTMLElement>(".stage");
    const toolDock = document.querySelector<HTMLElement>(".toolDock");
    const panDock = dockRef.current;
    if (!stage || !toolDock || !panDock) return;

    // Keep the tool dock centered in the usable canvas, unless it would
    // overlap Pan. The latter owns a 16px safety gap and pushes the dock only
    // as far as necessary; ResizeObserver picks up Pan's hover expansion.
    const updateToolDockPosition = () => {
      const stageRect = stage.getBoundingClientRect();
      const panRect = panDock.getBoundingClientRect();
      const toolRect = toolDock.getBoundingClientRect();
      const centered = (stageRect.width - rightPanelWidth) / 2;
      const minimum = panRect.right - stageRect.left + 16 + toolRect.width / 2;
      toolDock.style.setProperty("--tool-dock-center", \`\${Math.round(Math.max(centered, minimum))}px\`);
    };

    updateToolDockPosition();
    const observer = typeof ResizeObserver === "undefined" ? null : new ResizeObserver(updateToolDockPosition);
    observer?.observe(stage);
    observer?.observe(panDock);
    observer?.observe(toolDock);
    window.addEventListener("resize", updateToolDockPosition);
    return () => {
      observer?.disconnect();
      window.removeEventListener("resize", updateToolDockPosition);
      toolDock.style.removeProperty("--tool-dock-center");
    };
  }, [referenceImagePanelOpen, rightPanelWidth]);

  return (
    <div className="panDock" ref={dockRef}>
      <Button
        variant="unstyled"
        className="toolDock__button"
        data-on={panEnabled}
        aria-pressed={panEnabled}
        {...tapActivate(toggle)}
        title="Pan - drag anywhere on the canvas to pan, tap again to go back to drawing/selecting normally"
        aria-label="Toggle pan"
      >
        <PanIcon />
        <span>Pan</span>
      </Button>
    </div>
  );
}

    // no pointerup at all - without listening for those too, the resize
    // would get stuck mid-drag and these listeners would leak.
    const cleanup = () => {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      handle.removeEventListener("pointercancel", onUp);
      handle.removeEventListener("lostpointercapture", cleanup);
    };

      try {
        handle.releasePointerCapture(upEvent.pointerId);

        // Already released (e.g. by the lostpointercapture that's about to fire).
      }
      cleanup();

    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
    handle.addEventListener("pointercancel", onUp);
    handle.addEventListener("lostpointercapture", cleanup);
  };

    <aside className="rightPanel" aria-label="Pattern details" style={{ width: rightPanelWidth }}>

import { Button } from "./Button";

export type SegmentedOption<T extends string> = {
  value: T;
  /** Visible content; omit for a purely visual option (then give \`label\`). */
  children?: ReactNode;
  /** Accessible name and tooltip, required when \`children\` isn't text. */
  label?: string;
};

export type SegmentedControlProps<T extends string> = {
  /** Accessible name of the whole group. */
  label: string;
  options: readonly SegmentedOption<T>[];
  value: T | undefined;
  onChange: (value: T) => void;
  className?: string | undefined;
  /**
   * \`"custom"\` keeps the radio behaviour but leaves the look to \`className\`
   * (e.g. the pattern settings corner picker's 2×2 grid of squares).
   */
  appearance?: "segmented" | "custom";
};

/**
 * A single-choice row of options (role="radiogroup"). Arrow keys move the
 * choice, and only the chosen option is in the tab order, like a native
 * radio group.
 */
export function SegmentedControl<T extends string>({
  label,
  options,
  value,
  onChange,
  className,
  appearance = "segmented",
}: SegmentedControlProps<T>) {
  const groupRef = useRef<HTMLDivElement | null>(null);
  const current = Math.max(0, options.findIndex((o) => o.value === value));

  const onKeyDown = (event: KeyboardEvent<HTMLDivElement>) => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
    if (!step) return;
    event.preventDefault();
    const next = (current + step + options.length) % options.length;
    onChange(options[next]!.value);
    groupRef.current?.querySelectorAll<HTMLButtonElement>('[role="radio"]')[next]?.focus();
  };

  const classes = [appearance === "segmented" && "segmented", className].filter(Boolean).join(" ");
  return (
    <div ref={groupRef} className={classes || undefined} role="radiogroup" aria-label={label} onKeyDown={onKeyDown}>
      {options.map((option, i) => {
        const checked = option.value === value;
        return (
          <Button
            key={option.value}
            variant="unstyled"
            className={appearance === "segmented" ? "segmented__item" : undefined}
            role="radio"
            aria-checked={checked}
            aria-label={option.label}
            title={option.label}
            tabIndex={i === current ? 0 : -1}
            on={checked}
            onClick={() => onChange(option.value)}
          >
            {option.children}
          </Button>
        );
      })}
    </div>
  );
}

import { cellKey } from "../model/cellKey";
import { useDocStore } from "../state/docStore";
import { useUiStore } from "../state/uiStore";

/**
 * Opens the shared stitch picker whenever a new multi-selection is formed -
 * placements and empty cells alike. A single-cell selection of either kind
 * already opens its own picker as part of the click/marquee gesture that
 * made it; this only covers the multi-cell case, which a marquee can land
 * on without ever going through that per-click path.
 */
export function SelectionActions() {
  const selectedIds = useUiStore((state) => state.selectedPlacementIds);
  const selectedEmptyCells = useUiStore((state) => state.selectedEmptyCells);
  const openPicker = useUiStore((state) => state.openPicker);
  const index = useDocStore((state) => state.index);
  const revision = useDocStore((state) => state.revision);
  const openedSelection = useRef("");
  const openedEmptySelection = useRef("");

  useEffect(() => {
    if (selectedIds.length < 2) {
      openedSelection.current = "";
      return;
    }
    const key = [...selectedIds].sort().join(":");
    if (openedSelection.current === key) return;
    const selected = selectedIds.flatMap((id) => {
      const placement = index.placements.get(id);
      return placement ? [placement] : [];
    });
    if (selected.length < 2) return;
    openedSelection.current = key;
    const first = selected[0]!;
    const span = index.spanOf(first);
    const sameSpan = selected.every((placement) => index.spanOf(placement) === span);
    openPicker({
      col: first.col,
      row: first.row,
      x: 0,
      y: 0,
      selectionIds: selectedIds,
      ...(sameSpan ? { selectionSpan: span } : null),
    });
  }, [index, openPicker, revision, selectedIds]);

  useEffect(() => {
    if (selectedEmptyCells.length < 2) {
      openedEmptySelection.current = "";
      return;
    }
    const key = selectedEmptyCells.map((c) => cellKey(c.col, c.row)).sort().join(":");
    if (openedEmptySelection.current === key) return;
    openedEmptySelection.current = key;
    const first = selectedEmptyCells[0]!;
    openPicker({
      col: first.col,
      row: first.row,
      x: 0,
      y: 0,
      selectionEmptyCells: selectedEmptyCells,
    });
  }, [openPicker, selectedEmptyCells]);

  return null;
}

import { Button } from "./Button";
import { DisclosureIcon } from "./icons";

export type SideModuleProps = {
  title: string;
  subtitle: ReactNode;
  children?: ReactNode;
  /** Shown at the right of the header (non-collapsible modules only). */
  actions?: ReactNode;
  /** Makes the header a disclosure button; \`open\` controls the body. */
  collapsible?: { open: boolean; onToggle: () => void };
  className?: string | undefined;
  headerClassName?: string | undefined;
  bodyClassName?: string | undefined;
  ref?: Ref<HTMLElement>;
  /** Extra attributes for the section element (e.g. data-editing). */
  sectionProps?: Record<\`data-\${string}\`, string | boolean | undefined>;
};

/**
 * One card in the editor's right panel (glossary, reference image, export,
 * help, navigator): a header with title and subtitle, optionally a
 * disclosure toggle, and a body.
 */
export function SideModule({
  title,
  subtitle,
  children,
  actions,
  collapsible,
  className,
  headerClassName,
  bodyClassName,
  ref,
  sectionProps,
}: SideModuleProps) {
  const heading = (
    <div>
      <h2>{title}</h2>
      <span>{subtitle}</span>
    </div>
  );
  const showBody = children !== undefined && (!collapsible || collapsible.open);
  return (
    <section ref={ref} className={className ? \`sideModule \${className}\` : "sideModule"} {...sectionProps}>
      {collapsible ? (
        <Button
          variant="unstyled"
          className={["sideModule__header sideModule__toggle", headerClassName].filter(Boolean).join(" ")}
          onClick={collapsible.onToggle}
          aria-expanded={collapsible.open}
        >
          {heading}
          <DisclosureIcon width="14" height="14" data-open={collapsible.open} />
        </Button>
      ) : (
        <div className={["sideModule__header", headerClassName].filter(Boolean).join(" ")}>
          {heading}
          {actions}
        </div>
      )}
      {showBody && <div className={["sideModule__body", bodyClassName].filter(Boolean).join(" ")}>{children}</div>}
    </section>
  );
}

import { TextField } from "./Field";

export function SignIn() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState<"idle" | "sending" | "sent">("idle");
  const [error, setError] = useState<string | null>(null);
  const [googleBusy, setGoogleBusy] = useState(false);

  const onSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setStatus("sending");
    setError(null);

    const result = await sendMagicLink(email.trim());
    if (result.ok) {
      setStatus("sent");
    } else {
      setStatus("idle");
      setError(result.message);
    }
  };

  const onGoogleClick = async () => {
    setGoogleBusy(true);
    setError(null);
    const result = await signInWithGoogle();
    // A success here just means the redirect to Google started - this
    // component unmounts as the browser navigates away, so there's no
    // "signed in" state to set. Only a failure to even start it needs
    // showing; setGoogleBusy(false) would otherwise flash the button back
    // right before navigation anyway.
    if (!result.ok) {
      setGoogleBusy(false);
      setError(result.message);
    }
  };

  return (
    <main className="signIn">
      <div className="signIn__card">
        <h1 className="signIn__title">Stitch Ease Designer</h1>

        {status === "sent" ? (
          <p className="signIn__sent">
            Check <strong>{email}</strong> for a sign-in link. You can close this tab.
          </p>
        ) : (
          <>
            <Button variant="unstyled"
              className="signIn__google"
              onClick={onGoogleClick}
              disabled={googleBusy || status === "sending"}
            >
              <GoogleLogo width="16" height="16" />
              {googleBusy ? "Redirecting…" : "Continue with Google"}
            </Button>

            <div className="signIn__divider">or</div>

            <form className="signIn__form" onSubmit={onSubmit}>
              <label className="signIn__label" htmlFor="email">
                Email
              </label>
              <TextField
                id="email"
                type="email"
                required
                autoFocus
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="you@example.com"
                disabled={status === "sending" || googleBusy}
              />
              <Button variant="unstyled" type="submit" disabled={status === "sending" || googleBusy || !email.trim()}>
                {status === "sending" ? "Sending…" : "Send sign-in link"}
              </Button>
            </form>

            {error && <p className="signIn__error">{error}</p>}
          </>
        )}

        <p className="signIn__hint">
          Invite-only while this is in testing. Ask for an invite if you don't have one yet.
        </p>
      </div>
    </main>
  );
}

import { act } from "react";
import { beforeEach, describe, expect, it } from "vitest";
import { DocIndex } from "../model/docIndex";
import { getSymbol } from "../symbols/registry";
import { useDocStore } from "../state/docStore";
import { useUiStore } from "../state/uiStore";
import { setupReactRoot } from "../test/reactRoot";
import { StitchPicker } from "./StitchPicker";

const dom = setupReactRoot();

// Mirrors usePaintTool's openPickerForSingleSelection: selecting an
// already-placed stitch opens the picker with both \`currentSymbolId\` and
// \`selectionIds\` set to that one placement.
const selectPlacement = (placement: { col: number; row: number; symbolId: string; id: string }) => {
  act(() => {
    useUiStore.getState().openPicker({
      col: placement.col,
      row: placement.row,
      x: 0,
      y: 0,
      currentSymbolId: placement.symbolId,
      selectionIds: [placement.id],
      selectionSpan: 1,
    });
  });
};

const quickButton = (symbolId: string) =>
  dom.container.querySelector<HTMLButtonElement>(\`.picker__quickButton[aria-label="\${getSymbol(symbolId)!.label}"]\`);
const quickTile = (symbolId: string) => quickButton(symbolId)?.closest(".picker__quickTile");

/** Knit and purl in the quick row, nothing placed, picker mounted. */
function mountWithKnitPurlQuickRow() {
  beforeEach(() => {
    useDocStore.setState({
      index: DocIndex.from([]),
      glossaryIds: ["knit", "purl"],
      quickSymbolIds: ["knit", "purl"],
    });
    dom.render(<StitchPicker />);
  });
}

describe("StitchPicker quick-slot active highlight (#306)", () => {
  mountWithKnitPurlQuickRow();

  it("marks the regular quick-slot button for the selected placed stitch as active, and no other", () => {
    // StitchPicker is mounted (rendering null) from the very start of the
    // test, subscribed to the doc store - placing a stitch re-renders it
    // just as much as selecting one does, so it needs the same act() wrap.
    act(() => {
      useDocStore.getState().place("knit", 0, 0);
    });
    selectPlacement(useDocStore.getState().index.placementAt(0, 0)!);

    const knitButton = quickButton("knit");
    const purlButton = quickButton("purl");

    expect(knitButton?.getAttribute("data-active")).toBe("true");
    expect(purlButton?.getAttribute("data-active")).toBe("false");
  });

  it("marks the dynamic 6th-slot button as active when the selected stitch isn't one of the 5 quick slots", () => {
    act(() => {
      useDocStore.getState().place("yarn_over", 1, 0);
    });
    selectPlacement(useDocStore.getState().index.placementAt(1, 0)!);

    const dynamicButton = quickButton("yarn_over");

    expect(dynamicButton).not.toBeNull();
    expect(dynamicButton?.getAttribute("data-active")).toBe("true");
  });
});

/**
 * Characterization coverage for issue #323's \`QuickTile\` extraction: the
 * quick-slot tile's recolor \`ColorChip\` guard was \`!entry.colorId &&
 * currentSlot?.key === entry.key\`, while the dynamic 6th tile's was
 * \`!dynamicSlot.colorId && currentSlot\` (no key match) - equivalent in
 * practice since the dynamic tile only ever exists when it *is* the
 * current slot, but still two different guards to keep in sync by hand.
 * These pin the chip's actual visibility (not just its stated condition)
 * for both tile kinds before \`QuickTile\` standardized on one guard.
 *
 * Also issue #326's affordance matrix for quick tiles (FR-25/FR-34): only
 * the current tile gets a chip.
 */
describe("StitchPicker quick-tile recolor chip (issues #323, #326)", () => {
  mountWithKnitPurlQuickRow();

  it("shows the color chip only on the active, plain quick-slot tile - not an inactive one", () => {
    act(() => {
      useDocStore.getState().place("knit", 0, 0);
    });
    selectPlacement(useDocStore.getState().index.placementAt(0, 0)!);

    expect(quickTile("knit")?.querySelector(".picker__quickColorChip.colorChip")).toBeTruthy();
    expect(quickTile("purl")?.querySelector(".colorChip")).toBeNull();
    // Exactly one chip in the whole quick row - the active tile's.
    expect(dom.container.querySelectorAll(".picker__quickColorChip").length).toBe(1);
  });

  it("shows the recolor chip on the dynamic 6th tile when it's the active (plain) selection", () => {
    act(() => {
      useDocStore.getState().place("yarn_over", 1, 0);
    });
    selectPlacement(useDocStore.getState().index.placementAt(1, 0)!);

    expect(quickTile("yarn_over")?.querySelector(".picker__quickColorChip")).toBeTruthy();
    expect(dom.container.querySelectorAll(".picker__quickColorChip").length).toBe(1);
  });

/**
 * Regression coverage for #305: #296 wired \`unrecognizedKeyCleared\` into
 * \`docStore.place()\`/\`commit()\` (see docStore.test.ts's "#285" suite), but
 * only threaded it into usePaintTool.ts's freehand-paint call site. This
 * suite drives the same undo/redo assertions through StitchPicker's own
 * click handling instead of calling \`docStore.place()\` directly - that's
 * the gap the docStore-only suite couldn't have caught, since the picker's
 * single-cell pick and "replace all" paths were clearing the flag with a
 * plain uiStore mutation that never touched \`undoStack\` at all.
 */
describe("StitchPicker clearing the unrecognized-cell flag undoably (#305)", () => {
  beforeEach(() => {
    useDocStore.getState().openChart({ meta: { id: "c1", name: "c1", createdAt: "2026-01-01T00:00:00.000Z", updatedAt: "2026-01-01T00:00:00.000Z", rev: "r1" }, placements: [], unknownSymbolIds: [] });
  });

  const clickKnit = () => {
    const button = dom.container.querySelector<HTMLButtonElement>('[aria-label="Knit"]');
    expect(button).not.toBeNull();
    act(() => {
      button!.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
    });
  };

  it("single-cell pick: clears the flag via place()'s HistoryEntry so undo restores it", () => {
    useUiStore.getState().setReferenceImageUnrecognized("2,3", true);
    useUiStore.getState().openPicker({ col: 2, row: 3, x: 0, y: 0 });
    dom.render(<StitchPicker />);

    clickKnit();

    expect(useDocStore.getState().index.placementAt(2, 3)?.symbolId).toBe("knit");
    expect(useUiStore.getState().referenceImageUnrecognized.has("2,3")).toBe(false);
    // The fix's whole point: the clear must be attached to the placement's
    // own HistoryEntry, not a bare uiStore mutation undo knows nothing about.
    expect(useDocStore.getState().undoStack.at(-1)?.unrecognizedKeysCleared).toEqual(["2,3"]);

    act(() => useDocStore.getState().undo());
    expect(useDocStore.getState().index.placementAt(2, 3)).toBeUndefined();
    expect(useUiStore.getState().referenceImageUnrecognized.has("2,3")).toBe(true);

    act(() => useDocStore.getState().redo());
    expect(useDocStore.getState().index.placementAt(2, 3)?.symbolId).toBe("knit");
    expect(useUiStore.getState().referenceImageUnrecognized.has("2,3")).toBe(false);
  });

  it("batch 'replace all' pick: bundles every cleared flag into one undo step", () => {
    useUiStore.getState().setReferenceImageUnrecognized("0,0", true);
    useUiStore.getState().setReferenceImageUnrecognized("1,0", true);
    useUiStore.getState().openPicker({
      col: 0,
      row: 0,
      x: 0,
      y: 0,
      selectionEmptyCells: [
        { col: 0, row: 0 },
        { col: 1, row: 0 },
      ],
      reviewingSuggestion: true,
    });
    dom.render(<StitchPicker />);

    const before = useDocStore.getState().undoStack.length;
    clickKnit();

    expect(useDocStore.getState().index.placementAt(0, 0)?.symbolId).toBe("knit");
    expect(useDocStore.getState().index.placementAt(1, 0)?.symbolId).toBe("knit");
    expect(useUiStore.getState().referenceImageUnrecognized.size).toBe(0);
    // One merged HistoryEntry for the whole batch, not two, and not a
    // bare flag mutation that bypasses undoStack entirely.
    expect(useDocStore.getState().undoStack.length).toBe(before + 1);

    act(() => useDocStore.getState().undo());
    expect(useDocStore.getState().index.placementAt(0, 0)).toBeUndefined();
    expect(useDocStore.getState().index.placementAt(1, 0)).toBeUndefined();
    expect(useUiStore.getState().referenceImageUnrecognized.has("0,0")).toBe(true);
    expect(useUiStore.getState().referenceImageUnrecognized.has("1,0")).toBe(true);
  });
});

/**

  // route (a hand-placed stitch, a later successful scan) - filtered the
  // same way the right panel's count already is.
  const unrecognizedCells = unoccupiedCellsFromKeys(
    referenceImageUnrecognized,
    (col, row) => !!index.placementAt(col, row),

  // vertically - the same relationship StitchPicker keeps with a selection -

  // Recomputed on every relevant change so an in-progress pan or zoom

      ref={rootRef}
      className="suggestReview"
      style={{ left: pos.left, top: pos.top }}
      role="dialog"
      aria-label="Review suggested stitches"
    >
      <div className="suggestReview__group">
        <p className="suggestReview__heading suggestReview__heading--identified">
          {identified.length} identified
        </p>
        <div className="suggestReview__row">
          <Button variant="unstyled"
            className="suggestReview__action"
            onClick={acceptAllIdentified}
            disabled={!identifiedIds.length}
            aria-label="Accept all identified suggestions"
            title="Accept all"
          >
            <CheckIcon width={19} height={19} strokeWidth={1.7} />
            <span>Accept all</span>
          </Button>
          <Button variant="unstyled"
            className="suggestReview__action"
            onClick={dismissAllIdentified}
            disabled={!identifiedIds.length}
            aria-label="Dismiss all identified suggestions"
            title="Dismiss all"
          >
            <CrossIcon width={17} height={17} strokeWidth={1.7} />
            <span>Dismiss all</span>
          </Button>
        </div>
      </div>

      <span className="suggestReview__divider" aria-hidden="true" />

      <div className="suggestReview__group">
        <p className="suggestReview__heading suggestReview__heading--unrecognized">
          {unrecognizedCells.length} unidentified

        <div className="suggestReview__row">
          <Button variant="unstyled"
            className="suggestReview__action"
            onClick={dismissAllUnrecognized}

          </Button>
        </div>
      </div>
    </Popover>
  );

 * A symbol drawn as it appears on the chart: bordered cells, any meaningful
 * cell tint, and the glyph across the whole span. Used by the picker and

 *
 * The markup comes from our own build-time Figma export, not from user input.

 * render sites (canvas, cursor preview, and this component, which is what
 * both the picker's and the glossary's tiles use). FR-29's precedence: the
 * symbol's own tint (e.g. "no stitch" grey) overpaints the color, not the
 * reverse - the color fill is painted first, \`cellFills\` after.
 */
export function SymbolGlyph({
  symbol,
  cell = 22,
  chrome = true,
  colorId,
}: {
  symbol: StitchSymbol;
  /** Size of one cell in px. Cables shrink this to fit their tile. */
  cell?: number;
  chrome?: boolean;
  colorId?: string | null | undefined;
}) {
  const colorFill = colorId ? getSwatch(colorId)?.hex : undefined;
  const ink = glyphInkFor(colorId ?? undefined, "currentColor");
  const width = cell * symbol.span;
  const svgRef = useRef<HTMLSpanElement>(null);

  // The source library uses a shared cell-sized artboard, but several of its
  // paths are slightly off-centre inside that artboard. Centre the actual
  // vector bounds rather than the artboard so every preview sits cleanly in
  // the same visual column (without changing its chart geometry).
  useLayoutEffect(() => {
    const svg = svgRef.current?.querySelector("svg");
    if (!svg) return;

    svg.style.transform = "translate(0px, 0px)";
    try {
      const viewBox = svg.viewBox.baseVal;
      const bounds = svg.getBBox();
      if (!bounds.width || !bounds.height || !viewBox.width || !viewBox.height) return;
      // Pixels, not percent: percentage resolution for \`transform\` on an SVG
      // root element isn't consistent between engines (WebKit vs Chromium),
      // so a percent-based shift here landed right in Chromium but drifted
      // toward the top-left in Safari/WebKit. Converting through the SVG's
      // actual rendered size sidesteps that ambiguity entirely.
      const rendered = svg.getBoundingClientRect();
      const scaleX = rendered.width / viewBox.width;
      const scaleY = rendered.height / viewBox.height;
      const x = (viewBox.width / 2 - (bounds.x + bounds.width / 2)) * scaleX;

    }

    <span className="glyph" style={{ width, height: cell, color: ink }}>
      {chrome &&
        Array.from({ length: symbol.span }, (_, i) => (
          <span
            key={i}
            className="glyph__cell"
            style={{
              left: i * cell,
              width: cell,
              height: cell,
              // Color fill first, the library's own per-cell tint after -
              // "no stitch" grey overpaints the pen's color, never the
              // reverse (FR-29).
            ...(colorFill ? { background: colorFill } : {}),

        className="glyph__svg"
        style={{ width, height: cell }}
        dangerouslySetInnerHTML={{ __html: symbol.glyph }}
      />
    </span>
  );

  const renameMotif = useDocStore((s) => s.renameMotif);
  const armedMotif = useUiStore((s) => s.armedMotif);
  const requestDelete = useUiStore((s) => s.setMotifDeleteRequest);

                  <span className="picker__span">{motif.width}×{motif.height}</span>

/** Push / Reset / Mirror / Detach for a selected motif copy. */
export function MotifCopyBubbles({ copyId, overridden, onDone }: { copyId: string; overridden: boolean; onDone: () => void }) {
  const doc = useDocStore.getState;
  const act = (fn: () => void) => () => {
    fn();
    onDone();
  };
  return (
    <>
      {overridden && (
        <>
          <Button variant="unstyled"
            onClick={act(() => doc().pushMotifCopy(copyId))}
            title="Make this copy's changes the motif - every copy updates"
            aria-label="Push changes to motif"
            data-label="Push to motif"
          >
            <PushToMotifIcon />
          </Button>
          <Button variant="unstyled"
            onClick={act(() => doc().resetMotifCopy(copyId))}
            title="Discard this copy's changes"
            aria-label="Reset copy to motif"
            data-label="Reset"
          >
            <ResetIcon />
          </Button>
        </>
      )}
      <Button variant="unstyled"
        onClick={act(() => doc().mirrorMotifCopy(copyId))}
        title="Mirror this copy"
        aria-label="Mirror copy"
        data-label="Mirror"
      >
        <MirrorIcon />
      </Button>
      <Button variant="unstyled"
        onClick={act(() => doc().detachMotifCopy(copyId))}
        title="Unlink this copy from its motif"
        aria-label="Detach copy"
        data-label="Detach"
      >
        <DetachIcon />
      </Button>
    </>
  );
}

/** Asks what happens to a deleted motif's copies (FR-64). */
export function MotifDeleteDialog() {
  const motifId = useUiStore((s) => s.motifDeleteRequest);
  const close = useUiStore((s) => s.setMotifDeleteRequest);
  const motif = useDocStore((s) => s.repeats.find((r) => r.id === motifId));
  if (!motifId || !motif) return null;
  const copies = motif.copies?.length ?? 0;
  const finish = (mode: "detach" | "delete") => {
    if (useUiStore.getState().armedMotif?.id === motifId) useUiStore.getState().armMotif(null);
    useDocStore.getState().deleteMotif(motifId, mode);
    close(null);
  };
  return (
    <ConfirmDialog
      message={
        copies
          ? \`"\${motif.name}" has \${copies} \${copies === 1 ? "copy" : "copies"} on this chart. What should happen to \${copies === 1 ? "it" : "them"}?\`
          : \`Delete "\${motif.name}"?\`
      }
      confirmLabel={copies ? "Delete copies" : "Delete"}
      extraActions={copies ? [{ label: "Detach copies", onClick: () => finish("detach") }] : []}
      onConfirm={() => finish("delete")}
      onCancel={() => close(null)}
    />
  );
}

/**
 * The motif glyph inside the same bordered cell a one-stitch glyph sits in,
 * so a motif row's icon matches every stitch row's (FR-64).

export function MotifCellGlyph({ cell = 20 }: { cell?: number }) {
  return (
    <span className="glyph" style={{ width: cell, height: cell }}>
      <span className="glyph__cell" style={{ left: 0, width: cell, height: cell }} />
      <span className="motifCellGlyph"><MotifGlyph size={Math.round(cell * 0.75)} /></span>
    </span>
  );
}

  z-index: var(--z-dock);

     with no home-indicator gesture area to clear), so this is additive,
     not risky. */

  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  box-shadow: var(--shadow-3);
  transform: translateX(-50%);
  backdrop-filter: var(--blur-glass);
}

.panDock {
  position: absolute;
  z-index: var(--z-dock);
  bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  left: var(--space-9);
  padding: var(--space-4);

  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  box-shadow: var(--shadow-3);
  backdrop-filter: var(--blur-glass);
}

/* Deliberately shown on every platform, not just touch: (hover: hover) and
   (pointer: fine) - tried here once to hide this on a mouse-and-keyboard
   desktop, since Space+drag already covers it there - unreliably reports
   true on iPadOS itself (a known quirk, worse still with a trackpad
   connected), which made the button invisible on the exact device it was
   built for. A persistent Pan tool button is a normal, unobjectionable
   thing for a desktop app to have anyway. */

/* This button's whole job is being held down - without opting out, iOS
   reads a sustained touch as a request for its own callout/selection menu
   instead of ever delivering it to us as a plain, held pointerdown.
   touch-action deliberately stays at its default here, not "none" - that
   implicitly makes this element capture the touch for its entire duration,
   which stopped pointerleave/pointerup from ever firing once the finger
   moved (read: stuck "always on", no way to release it). -webkit-touch-
   callout alone is the correct, narrower fix for the system long-press menu. */

  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

   button, so their centre automatically follows this compact/expanded width. */

    width: var(--control-xl);
    min-width: var(--control-xl);

    gap: 0;
    overflow: hidden;
    transition:

      padding 150ms ease,

    max-width: 0;
    overflow: hidden;
    opacity: 0;
    transition:
      max-width 150ms ease,
      opacity 100ms ease;
  }

  .panDock .toolDock__button:hover,
  .panDock .toolDock__button:focus-visible {
    width: 76px;
    padding: 0 var(--space-5);
    gap: var(--space-3);

  .panDock .toolDock__button:hover span,
  .panDock .toolDock__button:focus-visible span {
    max-width: 28px;
    opacity: 1;
  }
}

.toolDock__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  min-width: 58px;
  height: var(--control-xl);
  padding: 0 var(--space-6);

  border-radius: var(--radius-md);

.toolDock__button svg {

  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;

.toolDock__drawStop svg {

.toolDock__drawStop:focus-visible {
  background: var(--accent-soft-bg);

  .toolDock__drawStop:hover {
    background: var(--accent-soft-bg);

.toolDock__button[data-on="true"] {
  border-color: var(--accent);

  border-color: var(--suggest);

}

.toolDock__separator {
  width: var(--border-width);
  height: 24px;
  margin: 0 var(--space-3);
  background: var(--border);
}

.toolDock__eraser:focus-visible {
  border-color: var(--danger-soft-border);
  background: var(--danger-soft-bg);
  color: var(--danger);
}

@media (hover: hover) {
  .toolDock__eraser:hover {
    border-color: var(--danger-soft-border);
    background: var(--danger-soft-bg);
    color: var(--danger);
  }
}
